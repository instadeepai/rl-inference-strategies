defaults:
  - logger: logger
  - arch: anakin
  - system: sable/rec_sable
  - network: rec_retention
  - env: rware  # [cleaner, vector-connector, gigastep, lbf, rware, smax, mabrax, mpe]
  - _self_

hydra:
  searchpath:
    - file://mava/configs

inference:
  budget: 51200000
  n_attempts: 16
  n_envs: 128
  env_seed: 0
  evaluation_greedy: False
  time_constraint: 3600
  beam_width: ~
  top_k: ~
