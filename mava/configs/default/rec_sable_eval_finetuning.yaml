defaults:
  - logger: logger
  - arch: anakin
  - system: sable/rec_sable
  - network: rec_retention
  - env: vector-connector  # [cleaner, connector, gigastep, lbf, rware, smax, mabrax, mpe]
  - _self_

hydra:
  searchpath:
    - file://mava/configs

inference:
  budget: 2560 # number of total steps
  n_attempts: 128 # number of attempts on each step
  n_envs_per_batch: 1 # number of envs per batch
  max_trajectory_size: 32 # batch size for updating the network - number of trajectory for each problem
  num_params_updates: 1 # number of params to update per batch
  n_envs: 1 # number of problems
  env_seed: 0
  evaluation_greedy: False
  time_constraint: 200
  entropy_coef: 0.01

logger:
  use_neptune: False
  kwargs:
    neptune_tag: ["to-delete","online-ft","seeds_"]
  checkpointing:
    load_model: True
    download_model: True
    download_args:
      neptune_run_name: 'MAR-1106'
    load_args:
      checkpoint_uid: "20250116183625"
