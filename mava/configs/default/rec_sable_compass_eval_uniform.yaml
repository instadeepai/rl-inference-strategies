defaults:
  - logger: logger
  - arch: anakin
  - system: sable/rec_sable
  - network: rec_retention
  - env: vector-connector  # [cleaner, connector, gigastep, lbf, rware, smax, mabrax, mpe]
  - _self_

hydra:
  searchpath:
    - file://mava/configs

inference:
  budget: 6400
  n_attempts: 32
  n_envs: 128
  env_seed: 0
  evaluation_greedy: False
  time_constraint: 3600
  search_strategy:
    name: uniform_sampling
    kwargs:
      minval: -1.0
      maxval: 1.0

logger:
  use_neptune: True
  kwargs:
    neptune_tag: ["sable", "compass", "uniform", "evaluation"]
  checkpointing:
    load_model: True
    download_model: True
    download_args:
      neptune_run_name: "MAR-1448"
    load_args:
      checkpoint_uid: "20250131155052"

network:
  net_config:
    embed_dim: 128
    n_head: 4
  memory_config:
    timestep_chunk_size: 75 #2944 #75
    decay_scaling_factor: 0.8 #1

system:
  rollout_length: 225
